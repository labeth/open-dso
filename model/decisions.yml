schemaVersion: 2
decisions:
- id: DEC-TIER-PRODUCT
  title: The family model is held to the product life-cycle tier
  status: proposed
  date: '2026-11-07'
  context: The family model composes the core and the SDS1000CML+, both held to the product tier. Its own requirements
    and requirement links are proposed and claimed until the family owner reviews them, so the model declares no
    life-cycle tier yet and is checked with the engine's untiered severities.
  decision: 'Once the family owner approves the family requirements and accepts their requirement links, engmod.yml
    declares the product tier with this decision as its tier decision.

    Tier: Product

    Bundles: Foundation
    '
  consequences:
  - A scope model composed by the family must be at the product tier or carry an accepted below-tier risk; the
    DHO1000 joins when it is public and its model reaches the product tier, as the SDS800X HD did.
  - The family's architecture decisions stay in the core's decision log (open-dso-core/model/decisions.yml); this
    log holds only decisions about the family model itself.
