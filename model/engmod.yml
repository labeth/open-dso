  version: v0.1.0
  modelId: open-dso
  title: open-dso family engineering model
  introduction: 'The open oscilloscope firmware family as a system of systems: the shared core, which is the product,
    and one board-support package per scope. The model composes the public models (open-dso-core, the SDS1000CML+ and the SDS800X HD)
    and states the rules every scope keeps: one product family, one shared core, the same feature level, the same
    web API and look, and no vendor material in any public repository.'
  kind: system
