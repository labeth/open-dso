<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-dso</title>
<style>
  :root { --bg: #fff; --fg: #1d232b; --dim: #5b6672; --edge: #d9dee4; --link: #0b62c4; --code: #f3f5f7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161b; --fg: #dfe5ec; --dim: #8d97a3; --edge: #2d353f; --link: #6cb2ff; --code: #1b2129; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  a { color: var(--link); }
  h1 { font-size: 2em; margin: .2em 0 .4em; } h2 { margin-top: 1.6em; border-bottom: 1px solid var(--edge); padding-bottom: .2em; }
  code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: .9em; }
  pre { background: var(--code); padding: 12px; border-radius: 6px; overflow-x: auto; } pre code { padding: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; } th, td { border: 1px solid var(--edge); padding: 4px 8px; text-align: left; }
  .try { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
  .try a { padding: 10px 16px; border: 1px solid var(--link); border-radius: 8px; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="try"><a href="https://labeth.github.io/open-sds1000cml/">Try the SDS1000CML+ demo</a><a href="https://labeth.github.io/open-sds800xhd/">Try the SDS800X HD demo</a></div>
  <div id="readme">Loading…</div>
</main>
<script>
// A minimal rendering of the repository's README.md (its source of text):
// headings, paragraphs, lists, tables, code, emphasis and links; links into
// the repository go to its files on GitHub.
'use strict';
const repo = 'https://github.com/labeth/open-dso/blob/main/';
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const slug = (s) => s.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => {
    if (!/^(https?:|#|mailto:)/.test(u)) u = repo + u;
    return `<a href="${u}">${t}</a>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
}
function render(md) {
  const lines = md.replace(/<!--[\s\S]*?-->/g, '').split('\n');
  const out = [];
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const code = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); i++; continue;
    }
    const h = /^(#{1,4}) (.*)/.exec(l);
    if (h) { out.push(`<h${h[1].length} id="${slug(h[2])}">${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\|/.test(l)) {
      const rows = [];
      for (; i < lines.length && /^\|/.test(lines[i]); i++) rows.push(lines[i]);
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
      out.push('<table><tr>' + cells(rows[0]).map((c) => `<th>${c}</th>`).join('') + '</tr>' +
        rows.slice(2).map((r) => '<tr>' + cells(r).map((c) => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    const li = /^(\s*)(?:[-*]|\d+\.) (.*)/.exec(l);
    if (li) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      for (; i < lines.length && lines[i].trim() !== ''; i++) {
        const m = /^\s*(?:[-*]|\d+\.) (.*)/.exec(lines[i]);
        if (m) items.push(m[1]); else items[items.length - 1] += ' ' + lines[i].trim();
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>` + items.map((t) => `<li>${inline(t)}</li>`).join('') + `</${tag}>`);
      continue;
    }
    if (l.trim() === '') { i++; continue; }
    const para = [];
    for (; i < lines.length && lines[i].trim() !== '' && !/^(#|\||```|\s*[-*] |\s*\d+\. )/.test(lines[i]); i++) para.push(lines[i].trim());
    out.push(`<p>${inline(para.join(' '))}</p>`);
  }
  return out.join('\n');
}
fetch('README.md').then((r) => r.text()).then((md) => {
  document.getElementById('readme').innerHTML = render(md);
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}).catch(() => { document.getElementById('readme').textContent = 'The README could not be loaded.'; });
</script>
</body>
</html>
