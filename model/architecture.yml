schemaVersion: 2
architecture:
  functionalGroups:
  - id: FG-FAM
    name: Family governance
    description: The family's front door, its system model and the rules every repository of the family keeps.
    prose: 'The family is a system of systems: the shared core (open-dso-core) is the product, and each scope repository
      is a board-support package that implements the core''s board interface (HAL) for one instrument. This group
      holds what belongs to no single code repository: the family model, the cross-cutting documentation and the
      rules every repository keeps. Composed subsystems are the public repositories; private scope repositories are
      planned subsystems until they become public.'
  functionalUnits:
  - id: FU-FAM-GOVERNANCE
    name: Family model and documentation
    group: FG-FAM
    prose: 'The open-dso repository: the README, the architecture, adding-a-scope, contributing and status documents,
      and this model. It holds no code and copies no decision or specification; the family''s architecture decisions
      are the core''s decision log (open-dso-core/model/decisions.yml, among them ADR-UMBRELLA-REPO for this repository).'
  - id: FU-FAM-DHO1000
    name: DHO1000 board-support package (planned)
    group: FG-FAM
    prose: 'Planned subsystem: the Rigol DHO1000 scope repository (open-dho1000), private, at the specification stage.
      It joins this model as a composed subsystem when the repository becomes public, as the SDS800X HD did.'
    tags:
    - planned
    - private
  actors:
  - id: ACT-FAM-OWNER
    name: Family owner
    description: Maintains the family, approves its requirements and decisions, reviews requirement links and decides
      when a scope repository becomes public.
  - id: ACT-FAM-CONTRIBUTOR
    name: Contributor
    description: Proposes a change to a repository of the family, written from the family's own specifications.
  contract:
    provides:
    - id: CAP-FAM-OPEN-FIRMWARE
      kind: capability
      note: 'Open firmware for digital storage oscilloscopes as one family: the same features, the same web UI and
        the same look on every instrument it supports, written from the family''s own specifications.'
  composition:
    subsystems:
    - id: SUB-FAM-CORE
      name: open-dso-core
      dependency: core
      publication: public
    - id: SUB-FAM-SDS1000CML
      name: SDS1000CML+ firmware
      dependency: sds1000cml
      publication: public
    - id: SUB-FAM-SDS800XHD
      name: SDS800X HD firmware
      dependency: sds800xhd
      publication: public
