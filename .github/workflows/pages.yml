name: Pages

# The family's front door: site/index.html is the landing page with links
# to each scope's demo (each scope repository deploys its own), and
# site/docs.html renders this repository's README.md, the one source of the
# family's long text.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp README.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
